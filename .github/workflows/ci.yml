name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  linux-gcc:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Show toolchain
        run: |
          g++ --version
          cmake --version
          ninja --version
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test service
        run: |
          ./build/apps/vna-server/vna-server &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then
              exit 0
            fi
            sleep 0.25
          done
          exit 1

  windows-mingw-gcc:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Preserve LF line endings
        shell: pwsh
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Show toolchain
        run: |
          g++ --version
          cmake --version
          ninja --version
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test service
        shell: pwsh
        run: |
          $serverProcess = Start-Process `
            -FilePath '.\build\apps\vna-server\vna-server.exe' `
            -WindowStyle Hidden `
            -PassThru
          try {
            foreach ($attempt in 1..20) {
              try {
                $health = Invoke-RestMethod `
                  -Uri 'http://127.0.0.1:8080/api/v1/health'
                if ($health.status -eq 'ok') { exit 0 }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            throw 'vna-server did not become ready'
          } finally {
            Stop-Process -Id $serverProcess.Id -ErrorAction SilentlyContinue
          }
